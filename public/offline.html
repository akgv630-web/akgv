<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | AKGV Infra City</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0B1734;
      color: #F6F1E7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(199, 163, 90, 0.3);
      border-radius: 16px;
      padding: 40px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      display: inline-block;
      padding: 8px 16px;
      background: #C7A35A;
      color: #0B1734;
      font-weight: 700;
      font-size: 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 12px 0;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #C7A35A;
      color: #0B1734;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
      cursor: pointer;
      border: none;
      font-size: 15px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .contact-info {
      margin-top: 24px;
      font-size: 13px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">AKGV INFRA CITY</div>
    <h1>You are currently offline</h1>
    <p>Please check your internet connection to access live plot bookings, 3D house viewer, and member updates.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="contact-info">
      Emergency Inquiries: +91 6306917991<br>
      AKGV Infra City Private Limited
    </div>
  </div>
</body>
</html>
