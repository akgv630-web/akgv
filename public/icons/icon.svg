<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1734" />
      <stop offset="100%" stop-color="#050A17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#C7A35A" />
      <stop offset="100%" stop-color="#9E7E36" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1EA275" />
      <stop offset="100%" stop-color="#146B4D" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Architectural Tower Icons -->
  <g transform="translate(106, 90)">
    <!-- Tower 1 -->
    <path d="M40 230 L40 100 L90 70 L90 230 Z" fill="url(#emeraldGrad)" opacity="0.9" />
    <!-- Tower 2 (Center) -->
    <path d="M110 230 L110 30 L190 30 L190 230 Z" fill="url(#goldGrad)" />
    <!-- Tower 3 -->
    <path d="M210 230 L210 80 L260 110 L260 230 Z" fill="url(#emeraldGrad)" opacity="0.9" />

    <!-- Architectural Grid Lines -->
    <line x1="20" y1="230" x2="280" y2="230" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="125" y1="60" x2="175" y2="60" stroke="#0B1734" stroke-width="4" stroke-linecap="round" />
    <line x1="125" y1="90" x2="175" y2="90" stroke="#0B1734" stroke-width="4" stroke-linecap="round" />
    <line x1="125" y1="120" x2="175" y2="120" stroke="#0B1734" stroke-width="4" stroke-linecap="round" />
    <line x1="125" y1="150" x2="175" y2="150" stroke="#0B1734" stroke-width="4" stroke-linecap="round" />
    <line x1="125" y1="180" x2="175" y2="180" stroke="#0B1734" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="44" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">AKGV</text>
  <text x="256" y="420" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" fill="#F6F1E7" text-anchor="middle" letter-spacing="4">INFRA CITY</text>
  <text x="256" y="445" font-family="'Montserrat', sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="2">PRIVATE LIMITED</text>
</svg>
